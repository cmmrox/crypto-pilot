# Production overlay — use with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Adds auto-TLS (real domain), resource limits, restart policies, no host DB port.
name: cryptopilot

services:
  postgres:
    restart: always
    ports: []  # do NOT expose the database publicly in production
    deploy:
      resources:
        limits:
          memory: 768M

  backend:
    restart: always
    environment:
      CP_ENVIRONMENT: production
      CP_LOG_JSON: "true"
    deploy:
      resources:
        limits:
          memory: 768M

  frontend:
    restart: always

  caddy:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      CP_DOMAIN: ${CP_DOMAIN}
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Nightly encrypted backup to object storage (BSD §15).
  backup:
    image: postgres:16-alpine
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      CP_MASTER_KEY: ${CP_MASTER_KEY}
      CP_BACKUP_BUCKET: ${CP_BACKUP_BUCKET:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache openssl aws-cli >/dev/null 2>&1 || true
        while true; do
          sleep 86400
          TS=$$(date -u +%Y%m%dT%H%M%SZ)
          pg_dump -h postgres -U "$$POSTGRES_USER" "$$POSTGRES_DB" | gzip \
            | openssl enc -aes-256-cbc -pbkdf2 -pass "pass:$$CP_MASTER_KEY" -out "/tmp/cp-$$TS.sql.gz.enc"
          [ -n "$$CP_BACKUP_BUCKET" ] && aws s3 cp "/tmp/cp-$$TS.sql.gz.enc" "$$CP_BACKUP_BUCKET/" || true
          echo "backup $$TS done"
        done
