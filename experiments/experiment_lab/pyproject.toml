[project]
name = "cryptopilot-experiment-lab"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "cryptopilot-strategy-runtime==1.0.0",
  "fastapi==0.139.2",
  "uvicorn==0.34.0",
  "httpx==0.28.1",
  "pydantic-settings==2.7.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/experiment_lab"]

[tool.uv.sources]
cryptopilot-strategy-runtime = { path = "../../packages/strategy_runtime", editable = true }
