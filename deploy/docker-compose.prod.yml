# Production overlay — use with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Adds auto-TLS (real domain), resource limits, restart policies.
#
# There is NO postgres DATABASE service: production reuses the EXISTING shared
# Postgres already running on the server (e.g. the odoo Postgres). Point the app
# at it via .env:  CP_DB_NETWORK = that Postgres's docker network,
# CP_DB_HOST = its alias, CP_DATABASE_URL host = ${CP_DB_HOST}.
# (The `backup` service below is a job, not a database — it just runs pg_dump.)
name: cryptopilot

services:
  backend:
    restart: always
    environment:
      CP_ENVIRONMENT: production
      CP_LOG_JSON: "true"
    deploy:
      resources:
        limits:
          memory: 768M

  frontend:
    restart: always

  caddy:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      CP_DOMAIN: ${CP_DOMAIN}
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Nightly encrypted backup to object storage (BSD §15). NOT a database — this
  # job runs pg_dump against the EXISTING shared Postgres over the `database`
  # network, encrypts with CP_MASTER_KEY, and uploads to CP_BACKUP_BUCKET if set.
  backup:
    image: postgres:16-alpine
    restart: always
    environment:
      CP_DB_HOST: ${CP_DB_HOST}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      CP_MASTER_KEY: ${CP_MASTER_KEY}
      CP_BACKUP_BUCKET: ${CP_BACKUP_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
    volumes:
      - ./scripts/backup_auth.py:/usr/local/bin/backup_auth.py:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        set -o pipefail
        umask 077
        apk add --no-cache openssl aws-cli python3 >/dev/null
        : "$${CP_BACKUP_BUCKET:?CP_BACKUP_BUCKET is required in production}"
        while true; do
          TS=$$(date -u +%Y%m%dT%H%M%SZ)
          OUT="/tmp/cp-$$TS.sql.gz.enc"
          MAC="$$OUT.mac"
          trap 'rm -f "$$OUT" "$$MAC"' EXIT HUP INT TERM
          pg_dump -h "$$CP_DB_HOST" -U "$$POSTGRES_USER" "$$POSTGRES_DB" \
            | gzip \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 600000 \
                -pass env:CP_MASTER_KEY -out "$$OUT"
          python3 /usr/local/bin/backup_auth.py create "$$OUT" "$$MAC"
          aws s3 cp "$$MAC" "$$CP_BACKUP_BUCKET/"
          aws s3 cp "$$OUT" "$$CP_BACKUP_BUCKET/"
          rm -f "$$OUT" "$$MAC"
          trap - EXIT HUP INT TERM
          echo "backup $$TS done"
          sleep 86400
        done
    networks:
      - database
