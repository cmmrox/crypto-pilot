[project]
name = "cryptopilot-experiment-lab"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "cryptopilot-strategy-runtime==1.0.0",
  "fastapi==0.139.2",
  "uvicorn==0.34.0",
  "httpx==0.28.1",
  "pydantic-settings==2.7.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/experiment_lab"]

[tool.uv.sources]
cryptopilot-strategy-runtime = { path = "../../packages/strategy_runtime", editable = true }

# Documented waiver: the Lab is research tooling that production never builds or
# deploys, and it is isolated from trading state by an import-linter contract. It is
# held to ruff's default rule set and line length (what it was written against), not
# the backend's stricter set. Tighten this in a dedicated change, not by accident of
# the directory ruff runs from.
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
