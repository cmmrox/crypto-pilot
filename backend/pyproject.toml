[project]
name = "cryptopilot-backend"
version = "0.1.0"
description = "CryptoPilot automated BTCUSDT trading backend (FastAPI + PostgreSQL)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.5",
    "pydantic-settings==2.7.1",
    "sqlalchemy[asyncio]==2.0.37",
    "asyncpg==0.30.0",
    "alembic==1.14.1",
    "structlog==25.1.0",
    "argon2-cffi==23.1.0",
    "pyjwt==2.10.1",
    "cryptography==44.0.0",
    "pyotp==2.9.0",
    "httpx==0.28.1",
    "websockets==14.2",
    "python-multipart==0.0.20",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "pytest-cov==6.0.0",
    "hypothesis==6.123.17",
    "ruff==0.9.2",
    "mypy==1.14.1",
    "import-linter==2.1",
    "testcontainers[postgresql]==4.9.0",
    "respx==0.22.0",
    "asgi-lifespan==2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "DTZ", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Alembic-generated migrations: don't enforce line length or import order on generated code.
"app/db/migrations/versions/*" = ["E501", "I001"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true
exclude = ["app/db/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "asgi_lifespan.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "exchange: tests that hit Binance DEMO (deselect with -m 'not exchange')",
    "parity: strategy parity tests against the research engine",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Strategies are pure (no I/O, no infra)"
type = "forbidden"
source_modules = ["app.strategies"]
forbidden_modules = [
    "app.execution",
    "app.risk",
    "app.api",
    "app.db",
    "app.notifier",
    "app.bot",
    "httpx",
    "sqlalchemy",
]

[[tool.importlinter.contracts]]
name = "News agent is isolated from trading and credentials"
type = "forbidden"
source_modules = ["app.news"]
forbidden_modules = [
    "app.execution",
    "app.strategies",
    "app.risk",
    "app.bot",
]
