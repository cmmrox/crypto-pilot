name: cryptopilot

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # Connects to an EXISTING shared Postgres reachable on the `database`
    # network as ${CP_DB_HOST}. There is no postgres service here anymore —
    # see docker-compose.postgres.yml for the optional standalone instance.
    environment:
      CP_ENVIRONMENT: ${CP_ENVIRONMENT}
      CP_DATABASE_URL: ${CP_DATABASE_URL}
      CP_MASTER_KEY: ${CP_MASTER_KEY}
      CP_JWT_SECRET: ${CP_JWT_SECRET}
      CP_FRONTEND_ORIGIN: ${CP_FRONTEND_ORIGIN}
      CP_LOG_LEVEL: ${CP_LOG_LEVEL}
      CP_LOG_JSON: ${CP_LOG_JSON}
      CP_OTP_TEST_MODE: ${CP_OTP_TEST_MODE:-false}
      CP_OTP_TEST_DISABLE_THROTTLE: ${CP_OTP_TEST_DISABLE_THROTTLE:-false}
      CP_LIVE_TRADING_APPROVED: ${CP_LIVE_TRADING_APPROVED:-false}
      CP_LIVE_KEY_PERMISSIONS_VERIFIED: ${CP_LIVE_KEY_PERMISSIONS_VERIFIED:-false}
      CP_CODEX_HOME: /data/codex
      CP_LAB_URL: ${CP_LAB_URL:-}
      CP_LAB_SERVICE_TOKEN: ${CP_LAB_SERVICE_TOKEN:-}
    volumes:
      - codex_data:/data/codex
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "8000"
    networks:
      - default
      - database

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - default

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      # Loopback remains the safe default. Set CP_HTTP_BIND=0.0.0.0 only for an
      # explicitly accepted temporary plaintext-access exception.
      - "${CP_HTTP_BIND:-127.0.0.1}:${CP_HTTP_PORT:-8090}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default

networks:
  default:
  # The existing shared Postgres lives on this externally-managed network.
  # Set CP_DB_NETWORK in .env to its name (e.g. gen-one-network locally).
  database:
    external: true
    name: ${CP_DB_NETWORK}

volumes:
  codex_data:
  caddy_data:
  caddy_config:
