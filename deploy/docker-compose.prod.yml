# Production overlay — use with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Adds auto-TLS (real domain), resource limits, restart policies.
#
# There is NO postgres DATABASE service: production reuses the EXISTING shared
# Postgres already running on the server (e.g. the odoo Postgres). Point the app
# at it via .env:  CP_DB_NETWORK = that Postgres's docker network,
# CP_DB_HOST = its alias, CP_DATABASE_URL host = ${CP_DB_HOST}.
# (The `backup` service below is a job, not a database — it just runs pg_dump.)
name: cryptopilot

services:
  backend:
    restart: always
    environment:
      CP_ENVIRONMENT: production
      CP_LOG_JSON: "true"
    deploy:
      resources:
        limits:
          memory: 768M

  frontend:
    restart: always

  caddy:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      CP_DOMAIN: ${CP_DOMAIN}
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Nightly encrypted backup to object storage (BSD §15). NOT a database — this
  # job runs pg_dump against the EXISTING shared Postgres over the `database`
  # network, encrypts with CP_MASTER_KEY, and uploads to CP_BACKUP_BUCKET if set.
  backup:
    image: postgres:16-alpine
    restart: always
    environment:
      CP_DB_HOST: ${CP_DB_HOST}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      CP_MASTER_KEY: ${CP_MASTER_KEY}
      CP_BACKUP_BUCKET: ${CP_BACKUP_BUCKET:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache openssl aws-cli >/dev/null 2>&1 || true
        while true; do
          sleep 86400
          TS=$$(date -u +%Y%m%dT%H%M%SZ)
          pg_dump -h "$$CP_DB_HOST" -U "$$POSTGRES_USER" "$$POSTGRES_DB" | gzip \
            | openssl enc -aes-256-cbc -pbkdf2 -pass "pass:$$CP_MASTER_KEY" -out "/tmp/cp-$$TS.sql.gz.enc"
          [ -n "$$CP_BACKUP_BUCKET" ] && aws s3 cp "/tmp/cp-$$TS.sql.gz.enc" "$$CP_BACKUP_BUCKET/" || true
          echo "backup $$TS done"
        done
    networks:
      - database
