name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shared Claude Code and Codex setup
        run: bash .agents/skills/cryptopilot-dev/scripts/validate-agent-setup.sh

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cryptopilot
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: cryptopilot_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U cryptopilot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Tests use an isolated DB; the conftest guard refuses the app DB name.
      CP_TEST_DATABASE_URL: postgresql+asyncpg://cryptopilot:devpass@localhost:5433/cryptopilot_test
      CP_DATABASE_URL: postgresql+asyncpg://cryptopilot:devpass@localhost:5433/cryptopilot_test
      CP_MASTER_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      CP_JWT_SECRET: jjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjj
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-groups
      - name: Production dependency lock integrity
        run: |
          uv export --frozen --no-dev --no-emit-project \
            --format requirements-txt \
            --output-file /tmp/cryptopilot-requirements.check
          diff -u \
            <(sed '1,2d' requirements.lock) \
            <(sed '1,2d' /tmp/cryptopilot-requirements.check)
      - name: Dependency audit
        run: uv run --frozen pip-audit
      - name: Lint (ruff)
        run: source .venv/bin/activate && ruff check app tests
      - name: Types (mypy strict)
        run: source .venv/bin/activate && mypy app
      - name: Import boundaries (import-linter)
        run: source .venv/bin/activate && lint-imports
      - name: Migrations up/down + drift
        run: |
          source .venv/bin/activate
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Strategy parity gate (must be zero mismatches — BSD G1)
        run: source .venv/bin/activate && pytest -q -m parity
      - name: Unit + integration tests
        run: source .venv/bin/activate && pytest -q --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit (fail on high+)
        run: npm audit --audit-level=high
      - name: Lint + typecheck
        run: npm run lint
      - name: Build
        run: npm run build

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Generate local secrets
        run: |
          cp deploy/.env.example deploy/.env
          MK=$(openssl rand -base64 32)
          JWT=$(openssl rand -base64 32)
          PW=$(openssl rand -hex 16)
          sed -i "s|change-me-strong|$PW|g" deploy/.env
          sed -i "s|REPLACE_WITH_openssl_rand_base64_32|$MK|" deploy/.env
          # second REPLACE (jwt) — replace remaining occurrence
          sed -i "0,/$MK/! s|REPLACE_WITH_openssl_rand_base64_32|$JWT|" deploy/.env
          sed -i 's|CP_ENVIRONMENT=development|CP_ENVIRONMENT=test|' deploy/.env
          sed -i 's|CP_OTP_TEST_MODE=false|CP_OTP_TEST_MODE=true|' deploy/.env
          sed -i 's|CP_OTP_TEST_DISABLE_THROTTLE=false|CP_OTP_TEST_DISABLE_THROTTLE=true|' deploy/.env
          sed -i 's|CP_DB_HOST=genone-postgres|CP_DB_HOST=cryptopilot-db|' deploy/.env
          sed -i 's|@genone-postgres:5432|@cryptopilot-db:5432|' deploy/.env
          sed -i 's|POSTGRES_DB=cryptopilot|POSTGRES_DB=cryptopilot_e2e|' deploy/.env
          sed -i 's|:5432/cryptopilot|:5432/cryptopilot_e2e|' deploy/.env
      - name: Start isolated database
        run: |
          docker network create gen-one-network
          docker compose -f deploy/docker-compose.postgres.yml up -d
      - name: Build & start stack
        run: docker compose -f deploy/docker-compose.yml up -d --build
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8090/health; then
              exit 0
            fi
            sleep 3
          done
          echo "Stack did not become healthy within 90 seconds." >&2
          docker compose -f deploy/docker-compose.yml ps
          exit 1
      - name: Provision E2E owner with test-mode SMS 2FA
        run: |
          docker compose -f deploy/docker-compose.yml exec -T backend \
            python -m app.cli create-owner \
            --email owner@cryptopilot.app --password 'PilotOwner!2026' \
            --phone 94711234567 --force
      - name: Seed deterministic E2E prerequisites
        run: |
          docker compose -f deploy/docker-compose.yml exec -T backend \
            python -m app.e2e_seed
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Playwright
        working-directory: qa
        run: |
          npm ci
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
          CP_BASE_URL=http://localhost:8090 npx playwright test
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            qa/playwright-report/
            qa/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop stack
        if: always()
        run: |
          docker compose -f deploy/docker-compose.yml down
          docker compose -f deploy/docker-compose.postgres.yml down -v
