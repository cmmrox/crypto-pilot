[project]
name = "cryptopilot-strategy-runtime"
version = "1.0.0"
description = "Pure, parameterized CryptoPilot strategy contracts and arithmetic"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.2", "pandas==2.2.3"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strategy_runtime"]

# Production code imported by the backend: lint and format it to the backend's
# standard no matter which directory ruff runs from.
[tool.ruff]
extend = "../../backend/pyproject.toml"
src = ["src"]
