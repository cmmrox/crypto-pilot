name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cryptopilot
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: cryptopilot
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U cryptopilot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CP_TEST_DATABASE_URL: postgresql+asyncpg://cryptopilot:devpass@localhost:5433/cryptopilot
      CP_DATABASE_URL: postgresql+asyncpg://cryptopilot:devpass@localhost:5433/cryptopilot
      CP_MASTER_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      CP_JWT_SECRET: jjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjj
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.11 .venv
      - run: |
          source .venv/bin/activate
          uv pip install -e .
          uv pip install pytest==8.3.4 pytest-asyncio==0.25.2 pytest-cov==6.0.0 \
            hypothesis==6.123.17 ruff==0.9.2 mypy==1.14.1 import-linter==2.1 \
            respx==0.22.0 asgi-lifespan==2.1.0
      - name: Lint (ruff)
        run: source .venv/bin/activate && ruff check app tests
      - name: Types (mypy strict)
        run: source .venv/bin/activate && mypy app
      - name: Import boundaries (import-linter)
        run: source .venv/bin/activate && lint-imports
      - name: Migrations up/down + drift
        run: |
          source .venv/bin/activate
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Unit + integration tests
        run: source .venv/bin/activate && pytest -q --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit (fail on high+)
        run: npm audit --audit-level=high
      - name: Lint + typecheck
        run: npm run lint
      - name: Build
        run: npm run build

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Generate local secrets
        run: |
          cp deploy/.env.example deploy/.env
          MK=$(openssl rand -base64 32)
          JWT=$(openssl rand -base64 32)
          PW=$(openssl rand -hex 16)
          sed -i "s|change-me-strong|$PW|g" deploy/.env
          sed -i "s|REPLACE_WITH_openssl_rand_base64_32|$MK|" deploy/.env
          # second REPLACE (jwt) — replace remaining occurrence
          sed -i "0,/$MK/! s|REPLACE_WITH_openssl_rand_base64_32|$JWT|" deploy/.env
      - name: Build & start stack
        run: docker compose -f deploy/docker-compose.yml up -d --build
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8090/health && break || sleep 3
          done
      - name: Provision E2E owner (deterministic TOTP secret)
        run: |
          docker compose -f deploy/docker-compose.yml exec -T backend \
            python -m app.cli create-owner \
            --email owner@cryptopilot.app --password 'PilotOwner!2026' \
            --totp-secret JBSWY3DPEHPK3PXP --force
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Playwright
        working-directory: qa
        run: |
          npm ci
          npx playwright install --with-deps chromium
          CP_BASE_URL=http://localhost:8090 npx playwright test
      - name: Stop stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down
