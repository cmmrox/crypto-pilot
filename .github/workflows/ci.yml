name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shared Claude Code and Codex setup
        run: bash .agents/skills/cryptopilot-dev/scripts/validate-agent-setup.sh

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cryptopilot
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: cryptopilot_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U cryptopilot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Tests use an isolated DB; the conftest guard refuses the app DB name.
      CP_TEST_DATABASE_URL: postgresql+asyncpg://cryptopilot:devpass@localhost:5433/cryptopilot_test
      CP_DATABASE_URL: postgresql+asyncpg://cryptopilot:devpass@localhost:5433/cryptopilot_test
      CP_MASTER_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      CP_JWT_SECRET: jjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjj
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-groups
      - name: Production dependency lock integrity
        run: |
          uv export --frozen --no-dev --no-emit-project \
            --no-emit-package cryptopilot-strategy-runtime \
            --format requirements-txt \
            --output-file /tmp/cryptopilot-requirements.check
          diff -u \
            <(sed '1,2d' requirements.lock) \
            <(sed '1,2d' /tmp/cryptopilot-requirements.check)
      - name: Dependency audit
        run: uv run --frozen pip-audit
      - name: Lint (ruff)
        run: source .venv/bin/activate && ruff check app tests
      - name: Formatting
        run: .venv/bin/python -m ruff format --check app tests
      - name: Types (mypy strict)
        run: source .venv/bin/activate && mypy app
      - name: Import boundaries (import-linter)
        run: source .venv/bin/activate && lint-imports
      - name: Migrations up/down + drift
        run: |
          source .venv/bin/activate
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Strategy parity gate (must be zero mismatches — BSD G1)
        run: source .venv/bin/activate && pytest -q -m parity
      - name: Unit + integration tests
        run: source .venv/bin/activate && pytest -q --cov=app --cov-report=term-missing
      - name: Experiment Lab workflow, data guards and legacy replay regression
        run: |
          PYTHONPATH=../experiments/experiment_lab/src:../experiments/backtesting/src \
            .venv/bin/python -m pytest -q ../experiments/experiment_lab/tests ../experiments/backtesting/tests
      - name: Lab formatting and type-checked bodies
        run: |
          .venv/bin/python -m ruff check ../experiments/experiment_lab/src ../experiments/experiment_lab/tests ../packages/strategy_runtime/src
          .venv/bin/python -m ruff format --check ../experiments/experiment_lab/src ../experiments/experiment_lab/tests ../packages/strategy_runtime/src
          PYTHONPATH=../experiments/experiment_lab/src .venv/bin/python -m mypy --config-file ../experiments/experiment_lab/mypy.ini ../experiments/experiment_lab/src/experiment_lab
      - name: Experiment Lab standalone locked environment
        working-directory: experiments/experiment_lab
        run: uv run --frozen --python 3.11 --with pytest==9.1.1 python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit (fail on high+)
        run: npm audit --audit-level=high
      - name: Lint + typecheck
        run: npm run lint
      - name: Formatting (Prettier)
        run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Generate local secrets
        run: |
          cp deploy/.env.example deploy/.env
          python3 - <<'PYTHON'
          from pathlib import Path
          import base64
          import secrets
          path = Path("deploy/.env")
          values = {
              "CP_MASTER_KEY": base64.b64encode(secrets.token_bytes(32)).decode(),
              "CP_JWT_SECRET": base64.b64encode(secrets.token_bytes(32)).decode(),
          }
          password = secrets.token_hex(16)
          lines = path.read_text().replace("change-me-strong", password).splitlines()
          path.write_text("\n".join(
              f"{line.split('=', 1)[0]}={values[line.split('=', 1)[0]]}"
              if line.split('=', 1)[0] in values else line for line in lines
          ) + "\n")
          PYTHON
          sed -i 's|CP_ENVIRONMENT=development|CP_ENVIRONMENT=test|' deploy/.env
          sed -i 's|CP_OTP_TEST_MODE=false|CP_OTP_TEST_MODE=true|' deploy/.env
          sed -i 's|CP_OTP_TEST_DISABLE_THROTTLE=false|CP_OTP_TEST_DISABLE_THROTTLE=true|' deploy/.env
          sed -i 's|CP_DB_HOST=genone-postgres|CP_DB_HOST=cryptopilot-db|' deploy/.env
          sed -i 's|@genone-postgres:5432|@cryptopilot-db:5432|' deploy/.env
          sed -i 's|POSTGRES_DB=cryptopilot|POSTGRES_DB=cryptopilot_e2e|' deploy/.env
          sed -i 's|:5432/cryptopilot|:5432/cryptopilot_e2e|' deploy/.env
      - name: Start isolated database
        run: |
          docker network create gen-one-network
          docker compose -f deploy/docker-compose.postgres.yml up -d
      - name: Build & start stack
        run: docker compose -f deploy/docker-compose.yml up -d --build
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8090/health; then
              exit 0
            fi
            sleep 3
          done
          echo "Stack did not become healthy within 90 seconds." >&2
          docker compose -f deploy/docker-compose.yml ps
          exit 1
      - name: Provision E2E owner with test-mode SMS 2FA
        run: |
          docker compose -f deploy/docker-compose.yml exec -T backend \
            python -m app.cli create-owner \
            --email owner@cryptopilot.app --password 'PilotOwner!2026' \
            --phone 94711234567 --force
      - name: Seed deterministic E2E prerequisites
        run: |
          docker compose -f deploy/docker-compose.yml exec -T backend \
            python -m app.e2e_seed
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Playwright
        working-directory: qa
        run: |
          npm ci
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
          CP_BASE_URL=http://localhost:8090 npx playwright test
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            qa/playwright-report/
            qa/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Backend logs on failure
        # Without these an e2e failure against real Binance cannot be diagnosed.
        # The stack's secrets are generated per run and never logged.
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color --tail=300 backend
      - name: Stop stack
        if: always()
        run: |
          docker compose -f deploy/docker-compose.yml down
          docker compose -f deploy/docker-compose.postgres.yml down -v
